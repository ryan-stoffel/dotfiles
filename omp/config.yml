skills:
  customDirectories:
    - ~/.dotfiles/omp/skills
startup:
  quiet: true
  showSplash: true
defaultThinkingLevel: max
symbolPreset: nerd
statusLine:
  preset: custom
  separator: slash
  sessionAccent: true
  transparent: true
  leftSegments:
    - model
    - path
    - git
  rightSegments:
    - usage
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: false
    path:
      abbreviate: true
      maxLength: 40
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: true
      showUnstaged: true
      showUntracked: false
  compactThinkingLevel: true
  showHookStatus: true
modelProviderOrder:
  - anthropic
  - openai-codex
  - google-antigravity
tools:
  approvalMode: yolo
providers:
  webSearchOrder:
    - anthropic
    - perplexity
    - gemini
    - codex
    - xai
    - zai
    - exa
    - tinyfish
    - jina
    - kagi
    - tavily
    - firecrawl
    - brave
    - kimi
    - parallel
    - synthetic
    - searxng
    - startpage
    - duckduckgo
    - ecosia
    - google
    - mojeek
    - public
setupVersion: 1
modelRoles:
  default: openai-codex/gpt-5.6-sol
enabledModels:
  - anthropic/claude-sonnet-5
  - anthropic/claude-opus-4-8
  - anthropic/claude-opus-5
  - google-antigravity/gemini-3.6-flash
  - openai-codex/gpt-5.6-sol
  - openai-codex/gpt-5.6-luna
  - openai-codex/gpt-5.6-terra
dev:
  autoqaConsent: granted
terminal:
  showProgress: false
tui:
  textSizing: false
  renderMermaid: true
  codexResetFireworks: true
  hyperlinks: auto
  tight: false
display:
  shimmer: kitt
  hideToolActivity: false
  showTokenUsage: false
steeringMode: one-at-a-time
error:
  notify: "on"
stt:
  enabled: false
autoResume: true
power:
  sleepPrevention: idle
contextPromotion:
  enabled: false
branchSummary:
  enabled: true
memory:
  backend: local
autolearn:
  enabled: true
edit:
  mode: hashline
readLineNumbers: true
read:
  renderMarkdown: true
lsp:
  formatOnWrite: true
bash:
  autoBackground:
    enabled: true
checkpoint:
  enabled: true
github:
  enabled: true
task:
  eager: default
codexResets:
  autoRedeem: "yes"